<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="103mm" viewBox="0 0 1120 630">
  <title>RCR-YOLO architecture</title>
  <desc>Editable vector schematic of the RCR-YOLO detector, including the YOLO11n backbone, training-only ORB-In branch, PANet neck, MRFE and LCRBase modules, and three detection heads.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#c97822"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 18px; font-weight: 700; }
      .section { font-size: 14px; font-weight: 700; }
      .label { font-size: 12px; }
      .small { font-size: 10.5px; }
      .tiny { font-size: 9.5px; }
      .box { stroke: #1f2933; stroke-width: 2; rx: 7; ry: 7; }
      .existing { fill: #e8f1f5; }
      .feature { fill: #d5e8ef; }
      .neck { fill: #e3efe5; }
      .head { fill: #f0f2f4; }
      .new { fill: #f6e2c8; stroke: #c97822; }
      .callout { fill: #fffdf9; stroke: #9aa5ad; stroke-width: 1.2; rx: 4; ry: 4; }
      .flow { stroke: #1f2933; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow-light { stroke: #43505a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .training { stroke: #c97822; stroke-width: 2.1; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-accent); }
      .divider { stroke: #c5cdd3; stroke-width: 1; }
    </style>
  </defs>

  <!-- Title -->
  <g id="title">
    <text font-size="16" x="560" y="28" text-anchor="middle" class="title">RCR-YOLO Architecture</text>
  </g>

  <!-- Input -->
  <g id="input">
    <rect x="28" y="225" width="112" height="86" class="box existing"/>
    <text font-size="14" x="84" y="253" text-anchor="middle" class="section">Input</text>
    <text font-size="12" x="84" y="272" text-anchor="middle" class="label">640 × 640</text>
    <text font-size="12" x="84" y="290" text-anchor="middle" class="label">RGB Image</text>
  </g>

  <!-- YOLO11n backbone -->
  <g id="backbone">
    <rect x="175" y="104" width="170" height="330" class="box existing"/>
    <text font-size="14" x="260" y="160" text-anchor="middle" class="section">YOLO11n</text>
    <text font-size="14" x="260" y="179" text-anchor="middle" class="section">Backbone</text>
    <line x1="198" y1="198" x2="322" y2="198" class="divider"/>
    <text font-size="12" x="260" y="229" text-anchor="middle" class="label">CSPDarknet</text>
    <text font-size="12" x="260" y="250" text-anchor="middle" class="label">C3k2</text>
    <text font-size="12" x="260" y="271" text-anchor="middle" class="label">C2PSA</text>
    <text font-size="11.5" x="260" y="314" text-anchor="middle" class="small">Multi-level feature</text>
    <text font-size="11.5" x="260" y="331" text-anchor="middle" class="small">extraction</text>
  </g>

  <path d="M140 268 L175 268" class="flow"/>

  <!-- Feature maps -->
  <g id="features">
    <rect x="324" y="120" width="88" height="52" class="box feature"/>
    <text font-size="12" x="368" y="141" text-anchor="middle" class="label">P2</text>
    <text font-size="11.5" x="368" y="158" text-anchor="middle" class="small">160 × 160</text>

    <rect x="324" y="204" width="88" height="52" class="box feature"/>
    <text font-size="12" x="368" y="225" text-anchor="middle" class="label">P3</text>
    <text font-size="11.5" x="368" y="242" text-anchor="middle" class="small">80 × 80</text>

    <rect x="324" y="288" width="88" height="52" class="box feature"/>
    <text font-size="12" x="368" y="309" text-anchor="middle" class="label">P4</text>
    <text font-size="11.5" x="368" y="326" text-anchor="middle" class="small">40 × 40</text>

    <rect x="324" y="372" width="88" height="52" class="box feature"/>
    <text font-size="12" x="368" y="393" text-anchor="middle" class="label">P5</text>
    <text font-size="11.5" x="368" y="410" text-anchor="middle" class="small">20 × 20</text>
  </g>

  <!-- Training-only ORB-In -->
  <g id="orb-in">
    <rect x="324" y="48" width="166" height="54" class="box new"/>
    <text font-size="14" x="407" y="69" text-anchor="middle" class="section">ORB-In</text>
    <text font-size="11.5" x="407" y="86" text-anchor="middle" class="small">Region + Edge Reconstruction</text>
    <text font-size="11" x="407" y="38" text-anchor="middle" class="tiny" fill="#a65914">Training only · bypassed at inference</text>
    <path d="M368 120 L397 102" class="training"/>
  </g>

  <!-- PANet neck -->
  <g id="neck">
    <rect x="450" y="188" width="146" height="190" class="box neck"/>
    <text font-size="14" x="523" y="235" text-anchor="middle" class="section">Neck</text>
    <text font-size="12" x="523" y="255" text-anchor="middle" class="label">(PANet)</text>
    <text font-size="12" x="523" y="290" text-anchor="middle" class="label">C3k2</text>
    <text font-size="12" x="523" y="310" text-anchor="middle" class="label">C2PSA</text>
    <line x1="473" y1="327" x2="573" y2="327" class="divider"/>
    <text font-size="11.5" x="523" y="350" text-anchor="middle" class="small">Bottom-up &amp;</text>
    <text font-size="11.5" x="523" y="366" text-anchor="middle" class="small">top-down fusion</text>
  </g>

  <!-- Feature fusion arrows -->
  <path d="M412 146 L450 220" class="flow-light"/>
  <path d="M412 230 L450 255" class="flow-light"/>
  <path d="M412 314 L450 290" class="flow-light"/>
  <path d="M412 398 L450 330" class="flow-light"/>

  <!-- Column callouts -->
  <g id="module-callouts">
    <rect x="608" y="68" width="142" height="56" class="callout"/>
    <text font-size="11" x="679" y="85" text-anchor="middle" class="tiny">Multi-Receptive Field</text>
    <text font-size="11" x="679" y="99" text-anchor="middle" class="tiny">Dilation rates (1, 2, 3)</text>
    <text font-size="11" x="679" y="113" text-anchor="middle" class="tiny">dynamic weighting</text>

    <rect x="764" y="68" width="142" height="56" class="callout"/>
    <text font-size="11" x="835" y="85" text-anchor="middle" class="tiny">Scene Context</text>
    <text font-size="11" x="835" y="99" text-anchor="middle" class="tiny">Multi-scale pooling</text>
    <text font-size="11" x="835" y="113" text-anchor="middle" class="tiny">(1×1, 2×2, 4×4)</text>
  </g>

  <!-- Three detection scales -->
  <g id="mrfe">
    <rect x="620" y="174" width="122" height="64" class="box new"/>
    <text font-size="14" x="681" y="201" text-anchor="middle" class="section">MRFE</text>
    <text font-size="12" x="681" y="220" text-anchor="middle" class="label">(P3/16)</text>
    <rect x="620" y="278" width="122" height="64" class="box new"/>
    <text font-size="14" x="681" y="305" text-anchor="middle" class="section">MRFE</text>
    <text font-size="12" x="681" y="324" text-anchor="middle" class="label">(P4/32)</text>
    <rect x="620" y="382" width="122" height="64" class="box new"/>
    <text font-size="14" x="681" y="409" text-anchor="middle" class="section">MRFE</text>
    <text font-size="12" x="681" y="428" text-anchor="middle" class="label">(P5/64)</text>
  </g>

  <g id="lcr-base">
    <rect x="780" y="174" width="122" height="64" class="box new"/>
    <text font-size="14" x="841" y="201" text-anchor="middle" class="section">LCRBase</text>
    <text font-size="12" x="841" y="220" text-anchor="middle" class="label">(P3/16)</text>
    <rect x="780" y="278" width="122" height="64" class="box new"/>
    <text font-size="14" x="841" y="305" text-anchor="middle" class="section">LCRBase</text>
    <text font-size="12" x="841" y="324" text-anchor="middle" class="label">(P4/32)</text>
    <rect x="780" y="382" width="122" height="64" class="box new"/>
    <text font-size="14" x="841" y="409" text-anchor="middle" class="section">LCRBase</text>
    <text font-size="12" x="841" y="428" text-anchor="middle" class="label">(P5/64)</text>
  </g>

  <g id="detect-heads">
    <rect x="938" y="174" width="132" height="64" class="box head"/>
    <text font-size="14" x="1004" y="198" text-anchor="middle" class="section">Detect Head</text>
    <text font-size="12" x="1004" y="216" text-anchor="middle" class="label">P3/16</text>
    <text font-size="11.5" x="1004" y="232" text-anchor="middle" class="small">(Class + Box)</text>
    <rect x="938" y="278" width="132" height="64" class="box head"/>
    <text font-size="14" x="1004" y="302" text-anchor="middle" class="section">Detect Head</text>
    <text font-size="12" x="1004" y="320" text-anchor="middle" class="label">P4/32</text>
    <text font-size="11.5" x="1004" y="336" text-anchor="middle" class="small">(Class + Box)</text>
    <rect x="938" y="382" width="132" height="64" class="box head"/>
    <text font-size="14" x="1004" y="406" text-anchor="middle" class="section">Detect Head</text>
    <text font-size="12" x="1004" y="424" text-anchor="middle" class="label">P5/64</text>
    <text font-size="11.5" x="1004" y="440" text-anchor="middle" class="small">(Class + Box)</text>
  </g>

  <!-- Main path arrows -->
  <path d="M596 224 L620 206" class="flow"/>
  <path d="M596 283 L620 310" class="flow"/>
  <path d="M596 342 L620 414" class="flow"/>
  <path d="M742 206 L780 206" class="flow"/>
  <path d="M742 310 L780 310" class="flow"/>
  <path d="M742 414 L780 414" class="flow"/>
  <path d="M902 206 L938 206" class="flow"/>
  <path d="M902 310 L938 310" class="flow"/>
  <path d="M902 414 L938 414" class="flow"/>

  <!-- Output aggregation -->
  <g id="output">
    <rect x="1070" y="228" width="44" height="178" class="box existing"/>
    <text font-size="11.5" x="1092" y="300" text-anchor="middle" class="small">Output</text>
    <text font-size="11" x="1092" y="317" text-anchor="middle" class="tiny">boxes</text>
    <text font-size="11" x="1092" y="331" text-anchor="middle" class="tiny">+ classes</text>
  </g>
  <path d="M1070 206 L1070 265" class="flow"/>
  <path d="M1070 310 L1070 310" class="flow"/>
  <path d="M1070 414 L1070 369" class="flow"/>

  <!-- Legend and training note -->
  <g id="legend">
    <text font-size="14" x="30" y="510" class="section">Legend</text>
    <rect x="30" y="523" width="18" height="14" fill="#d5e8ef" stroke="#1f2933" stroke-width="1.2"/>
    <text font-size="11.5" x="56" y="535" class="small">Backbone / features</text>
    <rect x="205" y="523" width="18" height="14" fill="#e3efe5" stroke="#1f2933" stroke-width="1.2"/>
    <text font-size="11.5" x="231" y="535" class="small">PANet neck</text>
    <rect x="342" y="523" width="18" height="14" fill="#f6e2c8" stroke="#c97822" stroke-width="1.2"/>
    <text font-size="11.5" x="368" y="535" class="small">Proposed modules</text>
    <line x1="510" y1="530" x2="544" y2="530" class="training"/>
    <text font-size="11.5" x="554" y="535" class="small">Training-only branch</text>
    <rect x="720" y="505" width="365" height="39" fill="#fffdf9" stroke="#c97822" stroke-width="1.4" rx="6" ry="6"/>
    <text font-size="11.5" x="736" y="522" class="small">Training: ORB-In provides auxiliary supervision.</text>
    <text font-size="11.5" x="736" y="538" class="small">Inference: ORB-In is bypassed with zero added cost.</text>
  </g>
</svg>
